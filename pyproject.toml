[project]
name = "agno-software-factory"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno>=2.8.6",
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "uvicorn>=0.52.1",
    "typer>=0.15.0",
    "google-genai>=0.2.0",
    "openai>=1.0.0",
    "duckduckgo-search>=6.0.0",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.14.2",
]

[project.scripts]
asf = "asf_core.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]

name: Validate Supported Models

on:
  schedule:
    - cron: '0 0 * * 0' # Run every Sunday at midnight
  workflow_dispatch:      # Allow manual triggering

jobs:
  validate-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Run Model Validation Prober
        env:
          # In CI, we must provide the API key as ADC won't be available by default
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv run python scripts/validate_models.py

      - name: Check for Matrix Updates
        id: git-check
        run: |
          if [ -n "$(git status --porcelain docs/model_compatibility_matrix.md)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push Matrix Updates
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/model_compatibility_matrix.md
          git commit -m "chore(docs): Update model compatibility matrix"
          git push

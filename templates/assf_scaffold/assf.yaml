domain:
  name: "software_engineering"
  description: "You are operating in a modern Software Engineering environment. Focus on clean code, SOLID principles, and strict deterministic execution."

model_tiers:
  # HEAVY: For intense cognitive tasks (architecture, complex code, adversarial review)
  heavy:
    - "openai:gpt-4o"
    - "anthropic:claude-3-5-sonnet"
  
  # WORKHORSE: For continuous, medium-complexity tasks (data structuring, mapping)
  workhorse:
    - "openai:gpt-5.6-terra"
    - "google:gemini-1.5-pro"
  
  # LIGHTWEIGHT: For fast, low-complexity tasks (web search, reading, simple docs)
  lightweight:
    - "google:gemini-1.5-flash"
    - "openai:gpt-5.6-luna"

limits:
  correction_loop_max_attempts: 3
